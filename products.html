<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Products | Gift City Qatar</title>
<meta name="description" content="Browse Gift City Qatar's advertising items and gifts. Tap Buy Now to ask about a product on WhatsApp.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="index.html" aria-label="Gift City Qatar, home">
      <img class="brand-logo" src="logo.png" alt="" width="44" height="44">
      <span class="brand-name">Gift City</span>
    </a>
    <nav class="links" id="links" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="products.html" class="on" aria-current="page">Products</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <div class="nav-right">
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to light theme" title="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="links">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="shop">
  <div class="wrap">
    <h1>Products</h1>
    <p class="shop-lede">Tap Buy Now on any item. WhatsApp opens with the product name, type and code filled in, and we reply with the price and stock.</p>
    <div class="chips" id="chips" role="group" aria-label="Filter by type" hidden></div>
    <p class="pnote" id="pnote" role="status">Loading products…</p>
    <div class="pgrid" id="pgrid"></div>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span class="brand-name">Gift City Qatar</span>
    <span>Advertising items and printing, Doha</span>
    <a class="quiet" href="index.html">Back to home</a>  </div>
</footer>

<dialog class="pdlg" id="pdlg" aria-labelledby="pdName">
  <button class="lb-close" id="pdClose" type="button" aria-label="Close details">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>
  <div class="pd-media" id="pdImg"></div>
  <div class="pd-info">
    <span class="pcard-cat" id="pdCat"></span>
    <h2 id="pdName"></h2>
    <p class="pcard-code" id="pdCode"></p>
    <p class="pcard-price" id="pdPrice"></p>
    <p class="pd-desc" id="pdDesc"></p>
    <a class="btn" id="pdBuy" href="#" target="_blank" rel="noopener noreferrer">Buy Now</a>
  </div>
</dialog>

<script src="chat.js" defer></script>
<script src="config.js"></script>
<script src="shop.js"></script>
<script src="products.js"></script>
</body>
</html>
